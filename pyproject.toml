[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mamyshev-ml"
version = "0.0.1"
description = "Accuracy-first synthetic ML and provenance-aware MATLAB data interfaces"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.4.6", "scipy==1.17.1", "scikit-learn==1.9.1",
  "matplotlib==3.11.2", "joblib==1.6.0", "threadpoolctl==3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mamyshev_ml]
conda_environment = "mamyshev-ml"
python_version = "3.11"
