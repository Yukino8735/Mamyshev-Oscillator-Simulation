# Existing Miniforge environment; V4 adds only the required CPU scientific stack.
name: mamyshev-ml
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==2.4.6
      - scipy==1.17.1
      - scikit-learn==1.9.1
      - matplotlib==3.11.2
      - joblib==1.6.0
      - threadpoolctl==3.7.0
